name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nfc_ci
          POSTGRES_PASSWORD: nfc_ci_only
          POSTGRES_DB: nfc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfc_ci -d nfc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nfc_ci:nfc_ci_only@127.0.0.1:5432/nfc_ci
      TEST_DATABASE_URL: postgresql://nfc_ci:nfc_ci_only@127.0.0.1:5432/nfc_ci
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
      PUBLIC_BASE_URL: http://127.0.0.1
      CORS_ORIGINS: http://127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm isolated test database
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          import psycopg

          url = os.environ["TEST_DATABASE_URL"]
          parsed = urlsplit(url)
          if (
              url != os.environ["DATABASE_URL"]
              or parsed.hostname != "127.0.0.1"
              or parsed.path != "/nfc_ci"
              or parsed.username != "nfc_ci"
          ):
              raise SystemExit("Refusing to test against a non-CI database")

          with psycopg.connect(url) as connection:
              database, user = connection.execute(
                  "SELECT current_database(), current_user"
              ).fetchone()
          if (database, user) != ("nfc_ci", "nfc_ci"):
              raise SystemExit("Connected to an unexpected database or role")
          PY

      - name: Run backend tests without skips
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(
              f"Executed: {result.testsRun}; failures: {len(result.failures)}; "
              f"errors: {len(result.errors)}; skipped: {len(result.skipped)}",
              flush=True,
          )
          if result.testsRun == 0 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
